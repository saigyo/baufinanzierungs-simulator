name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write        # Check-Run der publish-test-results-Action
  pull-requests: write # PR-Kommentar der publish-test-results-Action

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-und-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktions-Build
        run: npm run build

      - name: Standalone-Build
        run: npm run build:standalone

      - name: Unit-Tests
        run: >
          npx vitest run --reporter=default --reporter=json --reporter=junit
          --outputFile.json=test-results.json --outputFile.junit=test-results.xml

      - name: Testergebnis ins Summary schreiben
        if: always()
        run: node .github/scripts/test-summary.mjs test-results.json

      - name: Testergebnis im PR publizieren
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
          check_name: Testergebnisse
